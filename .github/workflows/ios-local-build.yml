name: iOS local build on GitHub macOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build signed iOS IPA locally
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          mkdir -p artifacts
          npx eas-cli build --platform ios --profile preview --local --non-interactive --output ./artifacts/Clean4Jesus.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: clean4jesus-ios-ipa
          path: artifacts/Clean4Jesus.ipa
          if-no-files-found: error
