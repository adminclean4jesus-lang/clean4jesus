name: iOS local build on GitHub macOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Registrar target DeviceActivityReport
        run: node scripts/patch-apple-targets.mjs

      - name: Confirmar versión de la IPA
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          BUILD=$(node -p "require('./app.json').expo.ios.buildNumber")
          LABEL="v${VERSION}-build-${BUILD}"
          echo "Construyendo Clean4Jesus ${LABEL} desde ${GITHUB_SHA}"
          echo "label=${LABEL}" >> "$GITHUB_OUTPUT"

      - name: Build signed iOS IPA locally
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_AUTH_CAPTCHA_ENABLED: ${{ secrets.EXPO_PUBLIC_AUTH_CAPTCHA_ENABLED }}
          EXPO_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.EXPO_PUBLIC_TURNSTILE_SITE_KEY }}
          EXPO_PUBLIC_TURNSTILE_CHALLENGE_URL: ${{ secrets.EXPO_PUBLIC_TURNSTILE_CHALLENGE_URL }}
        run: |
          mkdir -p artifacts
          npx eas-cli build --platform ios --profile preview --local --non-interactive --output ./artifacts/Clean4Jesus.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: clean4jesus-ios-ipa-${{ steps.version.outputs.label }}
          path: artifacts/Clean4Jesus.ipa
          if-no-files-found: error
