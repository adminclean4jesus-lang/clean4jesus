<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com 'unsafe-inline'; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline';" />
    <title>Verificacion Clean4Jesus</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>
    <style>
      :root { color-scheme: light; font-family: Arial, sans-serif; }
      * { box-sizing: border-box; }
      body { align-items: center; background: #fff; color: #17211d; display: flex; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; }
      main { text-align: center; width: 100%; }
      p { color: #66726d; font-size: 14px; line-height: 1.5; margin: 18px auto 0; max-width: 340px; }
      #challenge { display: flex; justify-content: center; min-height: 70px; }
    </style>
  </head>
  <body>
    <main>
      <div id="challenge"></div>
      <p>La comprobacion ocurre de forma segura con Cloudflare Turnstile.</p>
    </main>
    <script>
      function send(payload) {
        var message = JSON.stringify(payload);
        if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(message);
        var params = new URLSearchParams(window.location.search);
        var parentOrigin = params.get("parentOrigin");
        if (window.parent !== window && parentOrigin === "https://moderation.clean4jesus.com") {
          window.parent.postMessage(message, parentOrigin);
        }
      }

      window.addEventListener("load", function () {
        var params = new URLSearchParams(window.location.search);
        var sitekey = params.get("sitekey");
        var action = params.get("action") || "auth";
        if (!sitekey) {
          send({ type: "error", message: "missing_sitekey" });
          return;
        }

        var attempts = 0;
        var timer = setInterval(function () {
          attempts += 1;
          if (window.turnstile) {
            clearInterval(timer);
            window.turnstile.render("#challenge", {
              sitekey: sitekey,
              action: action,
              callback: function (token) { send({ type: "token", token: token }); },
              "error-callback": function () { send({ type: "error", message: "challenge_failed" }); },
              "expired-callback": function () { send({ type: "expired" }); },
              "timeout-callback": function () { send({ type: "error", message: "challenge_timeout" }); },
              "unsupported-callback": function () { send({ type: "error", message: "unsupported_device" }); },
              theme: "light"
            });
          } else if (attempts >= 50) {
            clearInterval(timer);
            send({ type: "error", message: "turnstile_unavailable" });
          }
        }, 100);
      });
    </script>
  </body>
</html>
