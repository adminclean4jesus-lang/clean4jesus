<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Confirma tu acompañamiento · Clean4Jesus</title><style>body{margin:0;background:#f4f6fa;color:#15213d;font:16px/1.55 Arial,sans-serif;padding:24px}main{max-width:520px;margin:5vh auto}.brand{text-align:center;color:#0d2860;font-size:20px;font-weight:700;margin:0 0 22px}.card{background:white;border-radius:24px;overflow:hidden;box-shadow:0 18px 45px #0d286026}.top{background:#0d2860;padding:30px;text-align:center}.top img{width:56px;height:56px}.content{padding:34px}.eyebrow{color:#ad7817;font-size:12px;font-weight:700;letter-spacing:1.5px}h1{color:#091a43;font-size:32px;line-height:1.1}p{color:#5d6c87}button{width:100%;min-height:54px;border:0;border-radius:999px;background:#0d2860;color:white;font-size:16px;font-weight:700;cursor:pointer}button:disabled{opacity:.65}.notice{text-align:center;font-size:13px}</style></head><body><main><div class="brand">Clean4Jesus</div><section class="card" aria-live="polite"><div class="top"><img src="/brand-mark.png" alt="Logo oficial de Clean4Jesus"></div><div class="content" id="content"><p class="eyebrow">ACOMPAÑAMIENTO DE CONFIANZA</p><h1>Confirma tu acompañamiento.</h1><p>Al confirmar, recibirás por correo el PIN de protección. La persona que te eligió no verá ese PIN en su teléfono.</p><button id="confirm">Confirmar y recibir el PIN</button><p class="notice">No necesitas descargar Clean4Jesus. Este enlace es de un solo uso.</p></div></section></main><script>const token=new URL(location.href).searchParams.get('token')||'';history.replaceState(null,'',location.pathname);const b=document.getElementById('confirm'),c=document.getElementById('content');if(!/^[A-Za-z0-9_-]{43}$/.test(token)){b.disabled=true;c.innerHTML='<h1>Enlace no válido</h1><p>Pide una nueva solicitud a quien te eligió.</p>'}else b.addEventListener('click',async()=>{b.disabled=true;b.textContent='Confirmando de forma segura…';try{const r=await fetch('https://moqlovsxklxcpihvheyc.supabase.co/functions/v1/guardian-pin-confirmation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});const d=await r.json();if(!r.ok||d.status!=='confirmed'){c.innerHTML='<h1>No pudimos confirmar.</h1><p>El enlace pudo vencer o ya fue usado, o el correo no pudo enviarse. Pide una nueva solicitud si el problema continúa.</p>';return}c.innerHTML='<p class="eyebrow">ACOMPAÑAMIENTO CONFIRMADO</p><h1>Tu PIN ya está en tu correo.</h1><p>Guárdalo en un lugar seguro y no lo reenvíes.</p>'}catch{b.disabled=false;b.textContent='Intentar nuevamente';}});</script></body></html>
