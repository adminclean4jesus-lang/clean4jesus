appId: com.clean4jesus.app
name: iOS Release startup stability
tags:
  - ios
  - release
  - startup
---
- launchApp
- extendedWaitUntil:
    visible: ".*(Refugio|Refuge|Protection|Protecci.n|protection|prote..o|PIN).*"
    timeout: 20000
- runFlow:
    when:
      visible: "New PIN"
    commands:
      - tapOn: "New PIN"
      - inputText: "2580"
      - tapOn: "Confirm new PIN"
      - inputText: "2580"
      - tapOn: "Save PIN"
      - extendedWaitUntil:
          visible: ".*(Refugio|Refuge|Protection|Protecci.n|protection|prote..o).*"
          timeout: 20000
- openLink: clean4jesus://ios-protection
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Family Controls:"
    timeout: 20000
- assertVisible: "Soportado"
- assertVisible: "Configurado"
- repeat:
    times: 20
    commands:
      - stopApp
      - launchApp
      - extendedWaitUntil:
          visible: ".*(Refugio|Refuge|Protection|Protecci.n|protection|prote..o|PIN).*"
          timeout: 20000
      - assertVisible: ".*(Refugio|Refuge|Protection|Protecci.n|protection|prote..o|PIN).*"
