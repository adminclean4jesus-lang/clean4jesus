appId: com.clean4jesus.app
name: iOS Release startup stability
tags:
  - ios
  - release
  - startup
---
# Open the native diagnostics route while the app is cold. Opening it after the
# PIN gate races with the onboarding redirect on simulator and can leave the
# test on pin-setup instead of exercising the Expo/Swift bridge.
- openLink: clean4jesus://ios-protection
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    id: "ios-protection-screen"
    timeout: 20000
- extendedWaitUntil:
    visible: "Family Controls:"
    timeout: 20000
- assertVisible: "Soportado"
- assertVisible: "Configurado"
- repeat:
    times: 20
    commands:
      - stopApp
      - launchApp
      - extendedWaitUntil:
          visible: "New PIN"
          timeout: 20000
      - assertVisible: "New PIN"
