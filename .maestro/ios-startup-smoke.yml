appId: com.clean4jesus.app
name: iOS Release startup stability
tags:
  - ios
  - release
  - startup
---
# The PIN gate is deliberately the first iOS screen. A deep link to diagnostics
# must not bypass it, so startup stability only asserts the protected entry
# state and repeated cold launches.
- launchApp
- extendedWaitUntil:
    visible: "New PIN"
    timeout: 20000
- assertVisible: "New PIN"
- repeat:
    times: 20
    commands:
      - stopApp
      - launchApp
      - extendedWaitUntil:
          visible: "New PIN"
          timeout: 20000
      - assertVisible: "New PIN"
