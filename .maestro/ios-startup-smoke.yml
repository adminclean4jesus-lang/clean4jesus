appId: com.clean4jesus.app
name: iOS Release startup stability
tags:
  - ios
  - release
  - startup
---
- launchApp
- extendedWaitUntil:
    visible: ".*(Refugio|Refuge|Protection|Protecci.n|protection|prote..o|PIN).*"
    timeout: 20000
- openLink: clean4jesus://ios-protection
- tapOn: "Open"
- extendedWaitUntil:
    visible: "Family Controls:"
    timeout: 20000
- assertVisible: "Soportado"
- assertVisible: "Configurado"
- repeat:
    times: 20
    commands:
      - stopApp
      - launchApp
      - extendedWaitUntil:
          visible: ".*(Refugio|Refuge|Protection|Protecci.n|protection|prote..o|PIN).*"
          timeout: 20000
      - assertVisible: ".*(Refugio|Refuge|Protection|Protecci.n|protection|prote..o|PIN).*"
