appId: com.clean4jesus.app
name: iOS Release startup stability
tags:
  - ios
  - release
  - startup
---
# The app must open without asking for the guardian PIN. The PIN protects a
# future change to configured limits, not devotional or community access.
- launchApp
- extendedWaitUntil:
    visible: ".*(Refugio|Refuge|iOS).*"
    timeout: 20000
- assertVisible: ".*(Refugio|Refuge|iOS).*"
- repeat:
    times: 20
    commands:
      - stopApp
      - launchApp
      - extendedWaitUntil:
          visible: ".*(Refugio|Refuge|iOS).*"
          timeout: 20000
      - assertVisible: ".*(Refugio|Refuge|iOS).*"
