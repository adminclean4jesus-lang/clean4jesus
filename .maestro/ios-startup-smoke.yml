appId: com.clean4jesus.app
name: iOS Release startup stability
tags:
  - ios
  - release
  - startup
---
# The app must open reliably; an authenticated user without a guardian PIN
# completes trusted-person setup before configuring protection.
- launchApp
- extendedWaitUntil:
    visible: ".*(Refugio|Refuge|iOS).*"
    timeout: 20000
- assertVisible: ".*(Refugio|Refuge|iOS).*"
- repeat:
    times: 20
    commands:
      - stopApp
      - launchApp
      - extendedWaitUntil:
          visible: ".*(Refugio|Refuge|iOS).*"
          timeout: 20000
      - assertVisible: ".*(Refugio|Refuge|iOS).*"
